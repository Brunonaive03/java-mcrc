services:
  java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soot-java
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      - ./SootAssignmentAnalysis:/SootAssignmentAnalysis
      - ./conflict-static-analysis:/conflict-static-analysis
    environment:
      - GITHUB_USER=${GITHUB_USER:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    stdin_open: true
    tty: true
    